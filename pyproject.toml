[tool.poetry]
name = "activity-recognition-lstm"
version = "1.0.0"
description = "Activity Recognition using Temporal Optical Flow Convolutional Features and Multi-Layer LSTM"
authors = ["Research Team <research@example.com>"]
readme = "README.md"
license = "MIT"
keywords = ["computer-vision", "activity-recognition", "lstm", "optical-flow", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
python = "^3.9"
numpy = "^1.24.0"
scipy = "^1.11.0"
scikit-image = "^0.22.0"
matplotlib = "^3.7.0"
opencv-python = "^4.8.0"
h5py = "^3.9.0"
pandas = "^2.0.0"
pyyaml = "^6.0"
pillow = "^10.0.0"
scikit-learn = "^1.3.0"
tensorflow = "^2.13.0"
click = "^8.1.0"
tqdm = "^4.66.0"
pathlib = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"
pre-commit = "^3.4.0"

[tool.poetry.scripts]
extract-features = "src.activity_recognition.cli:extract_features"
train-model = "src.activity_recognition.cli:train_model"
test-video = "src.activity_recognition.cli:test_video"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=html --cov-report=term-missing"